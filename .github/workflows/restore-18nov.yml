name: Restore the server to before the 18 Nov deploy

# ONE-OFF. The 18 Nov deploy (run 44284267367) broke the live site. That run
# downloaded every file it was about to replace into its "live-backup"
# artifact; this puts those files back exactly: .htaccess, robots.txt,
# wht.css, wht-elementor.css, wht.js and the wht-chrome plugin. The revert
# of the code on main redeploys the same old assets and plugin through
# deploy.yml as well, so the two agree.
#
# Runs when this file lands on main, or by hand from the Actions tab.
# Delete this file once the site is confirmed working.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-18nov.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: live-backup-44284267367
          path: live-backup
          run-id: 44284267367
          github-token: ${{ github.token }}

      - name: What the backup holds
        run: |
          find live-backup -type f -printf '  %P  %s bytes\n' | sort
          test -s live-backup/htaccess || { echo "::error::The backup has no .htaccess. Stopping rather than guess."; exit 1; }
          grep -q '# BEGIN WordPress' live-backup/htaccess || { echo "::error::The backed-up .htaccess has no WordPress block. Stopping."; exit 1; }
          if grep -q 'WHT Security\|WHT Performance' live-backup/htaccess; then
            echo "::error::The backed-up .htaccess already contains the new blocks; it is not the pre-deploy file."; exit 1
          fi

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Put the old files back
        env:
          SSHPASS: ${{ secrets.XNEELO_FTP_PASSWORD }}
          HOST: ${{ secrets.XNEELO_FTP_SERVER }}
          USER: ${{ secrets.XNEELO_FTP_USERNAME }}
        run: |
          B=live-backup
          P=public_html/wp-content/plugins/wht-chrome
          {
            echo "put $B/htaccess public_html/.htaccess"
            if [ -s $B/robots.txt ]; then
              echo "put $B/robots.txt public_html/robots.txt"
            else
              # There was no physical robots.txt before; WordPress served one.
              echo "-rm public_html/robots.txt"
            fi
            for f in $B/assets/*; do echo "put $f public_html/assets/"; done
            for f in $B/plugin/*; do echo "put $f $P/"; done
            echo "bye"
          } > /tmp/restore.sftp
          cat /tmp/restore.sftp
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 -P 22 -b /tmp/restore.sftp "$USER@$HOST"

      - name: Check
        run: |
          sleep 5
          for u in / /contact/ /assets/wht.css /wp-login.php; do
            printf '  %-20s %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://whtelectrical.co.za$u")"
          done
          curl -sI --max-time 30 https://whtelectrical.co.za/ | grep -i '^content-security-policy' \
            && echo "::warning::The new security headers are still being sent." \
            || echo "  security headers from 18 Nov: gone (as before)"
